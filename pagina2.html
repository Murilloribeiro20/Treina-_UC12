<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passaporte Digital Senac</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pagina2.css">
</head>

<body>
    <main class="container">
        <header>
            <div class="topo-header">
                <div>
                    <h2>Olá, Zacarias!</h2>
                    <div class="marca-treina">
                        <h1>TREINA<span>+</span></h1>
                        <p>Seu talento faz diferença</p>
                    </div>
                </div>
                <img class="logo-senac" src="./img/logo-senac.png" alt="Logo Senac">
            </div>
        </header>

        <section class="foto">
            <video autoplay muted loop playsinline controls>
                <source src="./vid/Turismo_Sem_Imagens.mp4" type="video/mp4">
                Seu navegador não suporta vídeos.
            </video>
        </section>

        <section class="conteudo">
            <p>Hoje você está escalado para o setor:</p>
            <div class="setor">SALÃO</div>

            <h3>Seu Passaporte Digital</h3>
            <p>Complete os módulos e conquiste o carimbo</p>

            <div class="progresso">
                <span id="contagem"></span>
                <div class="barra"><div id="barra"></div></div>
            </div>

            <div class="modulos">
                <button class="modulo concluido">
                    <strong>Postura e Encantamento</strong>
                    <small>Concluído</small>
                </button>
                <button class="modulo">
                    <strong>Higiene e Segurança</strong>
                    <small>Pendente</small>
                </button>
                <button class="modulo">
                    <strong>Conhecimento do Cardápio</strong>
                    <small>Pendente</small>
                </button>
                <button class="modulo">
                    <strong>Atendimento ao Cliente</strong>
                    <small>Pendente</small>
                </button>
                <button class="modulo">
                    <strong>Trabalho em Equipe</strong>
                    <small>Pendente</small>
                </button>
            </div>

            <div class="futuro">Você está construindo o seu futuro com o Senac!</div>
        </section>

        <footer>
            <div class="icone-menu ativo"><img src="./img/HOME.png" alt="Início"></div>
            <div class="icone-menu"><img src="./img/PERSON.png" alt="Perfil"></div>
            <div class="icone-menu"><img src="./img/MEDAL.png" alt="Conquistas"></div>
        </footer>
    </main>

    <script src="js/pagina2.js"></script>
</body>

</html>
